name: quality-gates

# The gates this repo's own checklist asks of other people's skills, applied to
# this repo. Runs on every push and PR without path filters: leaks and count
# drift land in README files, not only under skills/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Docs agree with disk
        run: python3 scripts/check_doc_counts.py

      - name: Skill index and routing are complete
        run: python3 scripts/gen_skill_index.py --check

      - name: Leak guard self-test (must fail closed)
        run: python3 scripts/test_scan_identifiers.py

      - name: Leak guard
        run: python3 scripts/scan_identifiers.py

      - name: Deliberately bad skill pack is caught, shipped pack is clean
        run: python3 scripts/test_probe_skill_pack.py
